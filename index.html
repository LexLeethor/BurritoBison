<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <style>
      /* Ensure parent elements fill the entire screen and remove scrollbars */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000; /* Optional background color */
      }
      
      .webgl-content {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }

      #gameContainer {
        width: 100% !important;
        height: 100% !important;
      }
      
      /* Target the internal canvas element that Unity generates */
      #gameContainer canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>

    <script src="UnityProgress.js"></script>
    <script src="burrito-bison-ll.js"></script>
    <script src="kongregate_api.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "burrito-bison-ll.json", {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function() {
            UnityProgress(gameInstance, "complete");
          }
        }
      });

      // Recalculate canvas size on window resize
      window.addEventListener("resize", function() {
        if (gameInstance && gameInstance.container) {
          // Triggers Unity WebGL canvas re-alignment
          window.dispatchEvent(new Event('resize'));
        }
      });
    </script>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer"></div>
    </div>
  </body>
</html>
